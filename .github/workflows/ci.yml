name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ruff==0.12.11 jsonschema==4.25.1 pyyaml==6.0.2
      - name: Lint Python
        run: ruff check apps scripts
      - name: Validate contracts and Compose syntax
        run: python apps/api/tests/validate_repository.py
      - name: Build native application images
        run: docker compose --env-file .env.example build api web
      - name: Run API acceptance tests (AT-01 through AT-14)
        run: python -m unittest discover -s apps/api/tests -p 'test_*.py' -v
      - name: Run OCR tests
        run: python -m unittest discover -s apps/ocr-worker/tests -p 'test_*.py' -v
      - name: Scan tracked files for secrets and real data
        run: python apps/api/tests/repository_scan.py
