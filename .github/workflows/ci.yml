name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ruff==0.12.11 jsonschema==4.25.1 pyyaml==6.0.2
      - name: Lint Python
        run: ruff check apps scripts infra
      - name: Validate contracts and Compose syntax
        run: python apps/api/tests/validate_repository.py
      - name: Run offline infrastructure tests
        run: |
          python -m unittest discover -s infra/minio/tests -p 'test_*.py' -v
          python -m unittest discover -s infra/network/tests -p 'test_*.py' -v
          python -m unittest discover -s infra/postgres/tests -p 'test_*.py' -v
      - name: Run infrastructure focused regression checks
        run: |
          python infra/postgres/tests/live_migration_lifecycle_acceptance.py --run-focused-regression-checks
          python infra/postgres/tests/live_migration_rollback_acceptance.py --run-focused-regression-checks
          python infra/postgres/tests/live_migration_lock_acceptance.py --run-focused-regression-checks
          python infra/postgres/tests/live_migration_drift_acceptance.py --run-focused-regression-checks
          python infra/postgres/tests/live_migration_history_drift_acceptance.py --run-focused-regression-checks
          python infra/postgres/tests/live_review_atomicity_acceptance.py --run-focused-regression-checks
          python infra/postgres/tests/live_state_transition_acceptance.py --run-focused-regression-checks
      - name: Run API acceptance tests (AT-01 through AT-14)
        run: python -m unittest discover -s apps/api/tests -p 'test_*.py' -v
      - name: Run OCR tests
        run: python -m unittest discover -s apps/ocr-worker/tests -p 'test_*.py' -v
      - name: Scan tracked files for secrets and real data
        run: python apps/api/tests/repository_scan.py
